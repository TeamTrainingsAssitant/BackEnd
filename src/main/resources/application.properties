spring.application.name=backend

# REST-API unter /api/v1
server.servlet.context-path=/api/v1
server.port=${PORT:8080}

# Datenbank: auf Heroku setzt der Java-Buildpack JDBC_DATABASE_URL/USERNAME/PASSWORD automatisch.
# Lokal: PostgreSQL auf localhost (Werte bei Bedarf per Umgebungsvariable ueberschreiben).
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/trainingsplan}
spring.datasource.username=${JDBC_DATABASE_USERNAME:postgres}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update

# Gueltigkeitsdauer eines Login-Tokens (z. B. 30m, 12h, 24h)
app.auth.token-ttl=24h
